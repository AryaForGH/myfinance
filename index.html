<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f8" />
    <meta name="description" content="A more mindful way to manage your money." />
    <title>MyFinance — Your money, in balance</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('myfinance-theme') || 'system'
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme =
            preference === 'system' ? (dark ? 'dark' : 'light') : preference
          document.documentElement.dataset.themePreference = preference
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.themePreference = 'system'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
